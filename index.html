<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خزنة الحظ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://adsgram.ai/js/adsgram-ad-sdk.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #1a1a1a; color: white; padding: 20px; }
        .vault { font-size: 100px; margin: 20px; }
        .balance { font-size: 24px; color: #ffd700; margin-bottom: 20px; }
        button { background-color: #ffd700; color: black; border: none; padding: 15px 30px; font-size: 18px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        button:disabled { background-color: #555; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>💰 خزنة الحظ 💰</h1>
    <div class="balance">أرباحك: <span id="rewardCount">0</span> نقطة</div>
    <div class="vault">🔒</div>
    <p>شاهد الإعلان لفتح الخزنة وجمع المفاتيح!</p>
    <button id="showAdBtn">فتح الخزنة (إعلان)</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ربط Adsgram باستخدام الـ Block ID بتاعك
        const AdController = window.Adsgram.init({ blockId: "27785" });
        let rewards = 0;

        document.getElementById('showAdBtn').addEventListener('click', () => {
            AdController.show().then((result) => {
                // لو المستخدم شاف الإعلان للآخر
                rewards++;
                document.getElementById('rewardCount').innerText = rewards;
                document.querySelector('.vault').innerText = '🔓';
                alert('مبروك! فتحت الخزنة وأخدت مفتاح ذهبي 🔑');
                setTimeout(() => { document.querySelector('.vault').innerText = '🔒'; }, 3000);
            }).catch((result) => {
                // لو قفل الإعلان أو حصل خطأ
                alert('لازم تشوف الإعلان كامل عشان تفتح الخزنة! ❌');
            });
        });
    </script>
</body>
</html>
