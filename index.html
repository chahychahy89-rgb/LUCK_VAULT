<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خزنة الحظ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            background-color: #0f0f0f; 
            color: #ffd700; 
            text-align: center; 
            font-family: sans-serif; 
            margin: 0;
            padding: 20px;
        }
        .vault-container { margin-top: 50px; }
        .vault-img { 
            width: 180px; 
            filter: drop-shadow(0 0 15px #ffd700); 
            margin-bottom: 20px;
        }
        .keys-count { 
            font-size: 22px; 
            margin: 20px 0; 
            background: #1a1a1a;
            padding: 10px;
            border-radius: 15px;
            border: 1px solid #ffd700;
        }
        .btn { 
            background: linear-gradient(45deg, #ffd700, #ff8c00); 
            color: black; 
            border: none; 
            padding: 15px 25px; 
            border-radius: 50px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 16px;
            width: 100%;
            max-width: 300px;
        }
        .timer { color: #fff; font-size: 14px; margin-top: 15px; opacity: 0.8; }
    </style>
</head>
<body>

    <div class="vault-container">
        <img src="https://cdn-icons-png.flaticon.com/512/2889/2889312.png" class="vault-img" alt="Vault">
        
        <h1>خزنة الحظ الكبرى</h1>
        <p>اجمع المفاتيح لفتح الخزنة والحصول على TON</p>

        <div class="keys-count">مفاتيحك الحالية: <span id="key-num">1</span> 🔑</div>
        
        <button class="btn" onclick="addKey()">احصل على مفتاح إضافي 📺</button>
        
        <div class="timer" id="countdown">الوقت المتبقي لفتح الخزنة: 05:42:10</div>
    </div>

    <script>
        // إعداد تطبيق تليجرام
        const tg = window.Telegram.WebApp;
        tg.expand(); // فتح التطبيق بالكامل

        function addKey() {
            // تنبيه بسيط للمستخدم (مؤقتاً)
            tg.showAlert("شاهد الإعلان بالكامل للحصول على المفتاح!");
            
            // زيادة عدد المفاتيح في الشاشة
            let currentKeys = parseInt(document.getElementById("key-num").innerText);
            document.getElementById("key-num").innerText = currentKeys + 1;
        }
    </script>
</body>
</html>
