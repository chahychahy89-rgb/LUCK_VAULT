<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خزنة الحظ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://adsgram.ai/js/adsgram-ad-sdk.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #1a1a1a; color: white; padding: 20px; }
        .card { background: #2a2a2a; border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        .balance { font-size: 30px; color: #ffcc00; margin: 10px 0; }
        .btn { background: #ffcc00; color: black; border: none; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; font-size: 18px; }
        #ton-connect-button { display: flex; justify-content: center; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div id="ton-connect-button"></div>
    <div class="card">
        <h1>💰 خزنة الحظ 💰</h1>
        <div class="balance"><span id="points">0</span> 💎</div>
        <button class="btn" id="watchAdBtn">افتح الخزنة (شاهد إعلان)</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ربط المحفظة
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://chahychahy89-rgb.github.io/LUCK_VAULT/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        // إعداد الإعلانات (مع وضع التجربة debug: true)
        const AdController = window.Adsgram.init({ blockId: "27785", debug: true });

        let points = localStorage.getItem('userPoints') || 0;
        document.getElementById('points').innerText = points;

        document.getElementById('watchAdBtn').addEventListener('click', () => {
            AdController.show().then(() => {
                points = parseInt(points) + 10;
                localStorage.setItem('userPoints', points);
                document.getElementById('points').innerText = points;
                alert('مبروك! حصلت على 10 جواهر 💎');
            }).catch(() => {
                alert('عذراً، لم يكتمل الإعلان.');
            });
        });
    </script>
</body>
</html>
