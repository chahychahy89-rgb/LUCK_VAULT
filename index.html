<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خزنة الحظ - Luck Vault</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://adsgram.ai/js/adsgram-ad-sdk.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #121212; 
            color: white; 
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card { 
            background: #1e1e1e; 
            border-radius: 25px; 
            padding: 30px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            width: 90%;
            max-width: 400px;
            margin-top: 20px;
        }
        .btn { 
            background: linear-gradient(45deg, #facc15, #eab308); 
            color: black; 
            border: none; 
            padding: 18px; 
            border-radius: 15px; 
            font-size: 20px; 
            font-weight: bold; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 25px;
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.98); }
        #ton-connect-button { margin-bottom: 20px; }
        .balance-container { 
            font-size: 48px; 
            margin: 20px 0; 
            font-weight: bold;
            color: #facc15;
        }
        h1 { font-size: 24px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="ton-connect-button"></div>

    <div class="card">
        <h1>💰 خزنة الحظ 💰</h1>
        <p>جمع الجواهر واستبدلها بجوائز</p>
        
        <div class="balance-container">
            <span id="points">0</span> 💎
        </div>

        <button class="btn" id="watchAdBtn">🔓 افتح الخزنة (إعلان)</button>
    </div>

    <script>
        // 1. تعريف بوت تليجرام
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // 2. إعداد ربط المحفظة (تأكدي أن الرابط صحيح تماماً)
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://chahychahy89-rgb.github.io/LUCK_VAULT/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        // 3. إعداد الإعلانات (مع وضع الاختبار Debug للتجربة)
        const AdController = window.Adsgram.init({ 
            blockId: "27785", 
            debug: true 
        });

        // 4. تحميل النقاط المحفوظة
        let points = parseInt(localStorage.getItem('userPoints')) || 0;
        document.getElementById('points').innerText = points;

        // 5. وظيفة زر فتح الخزنة
        document.getElementById('watchAdBtn').addEventListener('click', () => {
            // تنبيه بسيط لبدء العملية
            console.log("محاولة فتح الإعلان...");

            AdController.show().then(() => {
                // في حالة مشاهدة الإعلان بنجاح
                points += 10;
                localStorage.setItem('userPoints', points);
                document.getElementById('points').innerText = points;
                tg.showAlert("تهانينا! حصلت على 10 جواهر 💎");
            }).catch((result) => {
                // في حالة فشل الإعلان أو عدم توفره
                console.error("خطأ في الإعلان:", result);
                tg.showAlert("عذراً، الإعلان غير جاهز حالياً. تأكد أن حسابك في Adsgram أصبح Active.");
            });
        });
    </script>
</body>
</html>
