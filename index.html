
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luck Vault</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://adsgram.ai/js/adsgram-ad-sdk.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #1a1a1a; color: white; padding: 20px; }
        .card { background: #242424; border-radius: 20px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .btn { background: #facc15; color: black; border: none; padding: 15px 20px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; }
        #ton-connect-button { display: flex; justify-content: center; margin-bottom: 20px; }
        .balance-container { font-size: 40px; margin: 20px 0; }
    </style>
</head>
<body>
    <div id="ton-connect-button"></div>
    <div class="card">
        <h1>💰 خزنة الحظ 💰</h1>
        <div class="balance-container">💎 <span id="points">0</span></div>
        <button class="btn" id="watchAdBtn">افتح الخزنة (شاهد إعلان)</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); // تأكيد إن البوت جاهز
        tg.expand();

        // ربط المحفظة
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://chahychahy89-rgb.github.io/LUCK_VAULT/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        // إعداد الإعلانات - تأكدي من حرف A كبير في Adsgram
        const AdController = window.Adsgram.init({ blockId: "27785", debug: true });

        let points = localStorage.getItem('userPoints') || 0;
        document.getElementById('points').innerText = points;

        document.getElementById('watchAdBtn').addEventListener('click', () => {
            // محاولة إظهار الإعلان
            AdController.show().then(() => {
                // لو الإعلان خلص بنجاح
                points = parseInt(points) + 10;
                localStorage.setItem('userPoints', points);
                document.getElementById('points').innerText = points;
                tg.showAlert("مبروك! كسبت 10 جواهر 💎");
            }).catch((err) => {
                // لو حصل أي خطأ أو الإعلان لسه مراجعش
                console.error(err);
                tg.showAlert("الإعلان لسه بيحمل من الشركة، جرب كمان ثواني!");
            });
        });
    </script>
</body>
</html>
